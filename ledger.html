<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 가족</title>

<!-- 한글 폰트: 하나의 폰트 패밀리(굵기만 다르게)로 통일해 깔끔하게 표현 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />

<!-- ===== PWA 설정 ===== -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16181f" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="용돈기입장" />

<!-- Supabase 클라이언트 라이브러리 (CDN, 별도 설치 필요 없음) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="wrap">

  <!-- ================= 헤더 ================= -->
  <a class="back-link" href="index.html">← 처음으로</a>
  <header class="top">
    <h1 class="brand" id="pageTitle">용돈기입장</h1>
    <div class="today-label" id="todayLabel"></div>
  </header>


  <!-- ================= 상단 요약: 총수입 / 총지출 / 잔액 ================= -->
  <section class="summary">
    <div class="card income">
      <div class="label">총 수입</div>
      <div class="value" id="totalIncome">0원</div>
    </div>
    <div class="card expense">
      <div class="label">총 지출</div>
      <div class="value" id="totalExpense">0원</div>
    </div>
    <div class="card balance">
      <div class="label">현재 잔액</div>
      <div class="value" id="totalBalance">0원</div>
    </div>
  </section>

  <!-- ================= 월 탭 (이전전달 / 이전달 / 이번달 / 다음달) ================= -->
  <nav class="month-tabs" id="monthTabs"></nav>

  <!-- ================= 표 영역 ================= -->
  <section class="table-panel">
    <div class="locked-banner" id="lockedBanner" style="display:none;">
      🔒 이 달은 지난 달(또는 다음 달) 기록이라 수정할 수 없어요. 보기만 가능합니다.
    </div>
    <table class="ledger">
      <thead>
        <tr>
          <th style="width:110px;">날짜</th>
          <th style="width:70px;">구분</th>
          <th>항목</th>
          <th style="width:120px;">금액</th>
          <th style="width:100px;">결제수단</th>
          <th>메모</th>
          <th style="width:90px;"></th>
        </tr>
      </thead>
      <tbody id="ledgerBody">
        <!-- 실제 기록 행 + (이번달인 경우) 새 항목 입력 행이 js/app.js 에서 여기 채워집니다 -->
      </tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      아직 기록이 없어요. 아래 입력 줄에서 첫 기록을 추가해 보세요.
    </div>
  </section>

</div>

<script src="js/users.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
